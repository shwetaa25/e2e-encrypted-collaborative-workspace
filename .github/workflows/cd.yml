name: CD — Build & Deploy

# ─────────────────────────────────────────────────────────
# Runs ONLY when CI passes on the main branch.
# Jobs:
#   1. build-push    — Build Docker images, push to GHCR
#   2. deploy        — Update k8s manifests (triggers Argo CD)
# ─────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["CI — Test, Build, Scan"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ────────────────────────────────────────────
  # Job 1: Build & Push Docker Images to GHCR
  # ────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-backend.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (multi-platform builds)
        uses: docker/setup-buildx-action@v3

      # Generate image tags: git SHA + latest + semver if tagged
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push backend
      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Build and push frontend
      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Output image digests
        run: |
          echo "Backend: ${{ steps.build-backend.outputs.digest }}"
          echo "Frontend: ${{ steps.build-frontend.outputs.digest }}"

  # ────────────────────────────────────────────
  # Job 2: Update k8s manifests (GitOps via Argo CD)
  # ────────────────────────────────────────────
  deploy:
    name: Update Deployment Manifests
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Update the image tag in the k8s Deployment manifest.
      # Argo CD watches this file and auto-deploys when it changes.
      - name: Update backend image tag in k8s manifest
        run: |
          sed -i "s|image: ghcr.io/.*/backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ steps.sha.outputs.short }}|" \
            infra/k8s/backend/deployment.yml

      - name: Update frontend image tag in k8s manifest
        run: |
          sed -i "s|image: ghcr.io/.*/frontend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ steps.sha.outputs.short }}|" \
            infra/k8s/frontend/deployment.yml

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/
          git commit -m "chore(deploy): update image tags to sha-${{ steps.sha.outputs.short }} [skip ci]"
          git push

name: CI — Test, Build, Scan

# ─────────────────────────────────────────────────────────
# Runs on every push and every pull request.
# Jobs:
#   1. frontend-test  — TypeScript typecheck + unit tests
#   2. backend-test   — Go unit tests + race detector
#   3. integration    — Full stack integration tests
#   4. security-scan  — Trivy container scan + npm audit
# ─────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ────────────────────────────────────────────
  # Job 1: Frontend — TypeScript + Tests
  # ────────────────────────────────────────────
  frontend-test:
    name: Frontend — TypeCheck + Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ────────────────────────────────────────────
  # Job 2: Backend — Go Tests
  # ────────────────────────────────────────────
  backend-test:
    name: Backend — Go Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: encryptedws_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies (no tampering)
        run: go mod verify

      - name: Run schema migrations (test DB)
        run: |
          psql postgres://postgres:testpassword@localhost:5432/encryptedws_test \
            -f ../scripts/schema.sql
        env:
          PGPASSWORD: testpassword

      - name: Run unit tests with race detector
        run: go test -v -race -count=1 ./...
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/encryptedws_test?sslmode=disable
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          ENVIRONMENT: test

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/encryptedws_test?sslmode=disable
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long
          ENVIRONMENT: test

      - name: Check coverage threshold (min 70% on crypto packages)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "internal/crypto" | grep "total" | awk '{print $3}' | tr -d '%')
          echo "Crypto package coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below the 70% threshold for crypto packages"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

      - name: Run go vet (static analysis)
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "2023.1.6"
          working-directory: backend

  # ────────────────────────────────────────────
  # Job 3: Integration Tests
  # ────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env
          echo "JWT_SECRET=ci-jwt-secret-minimum-32-characters-long" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Start full stack
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend health check..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done

      - name: Setup Node.js for integration tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run integration test suite
        run: |
          cd scripts
          npm ci
          npm run test:integration
        env:
          API_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:3000

      - name: Run confidentiality test (DB has zero plaintext)
        run: bash scripts/confidentiality_check.sh
        env:
          PGPASSWORD: ci_test_password

      - name: Run revoke effectiveness test
        run: bash scripts/revoke_test.sh

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose logs backend > /tmp/backend.log
          docker compose logs postgres > /tmp/postgres.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: /tmp/*.log

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ────────────────────────────────────────────
  # Job 4: Security Scan
  # ────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # npm dependency vulnerability scan
      - name: npm audit (frontend dependencies)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high
        continue-on-error: false

      # Go dependency scan
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: govulncheck (Go vulnerability scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      # Secret leak detection (no keys accidentally committed)
      - name: Detect secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker images for Trivy scan
      - name: Build backend Docker image
        run: docker build -t backend-scan:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend-scan:ci ./frontend

      # Trivy container vulnerability scan
      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "backend-scan:ci"
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "frontend-scan:ci"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # Upload SARIF results to GitHub Security tab
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend.sarif"

      - name: Upload scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-reports
          path: |
            trivy-*.sarif

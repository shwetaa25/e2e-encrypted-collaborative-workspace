name: PR Quality Gates

# ─────────────────────────────────────────────────────────
# Runs on every pull request.
# Enforces: conventional commits, PR title format,
# code size limits, and auto-labels by changed files.
# ─────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:

  # ────────────────────────────────────────────
  # Enforce conventional commit format on PR title
  # ────────────────────────────────────────────
  pr-title:
    name: Check PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Valid prefixes: feat, fix, docs, chore, test, refactor, perf, ci
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            perf
            ci
            build

  # ────────────────────────────────────────────
  # Auto-label PRs based on which files changed
  # ────────────────────────────────────────────
  auto-label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  # ────────────────────────────────────────────
  # Warn if PR is too large (harder to review)
  # ────────────────────────────────────────────
  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Check PR diff size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            if (total > 800) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ **Large PR warning**: This PR changes ${total} lines (${additions} additions, ${deletions} deletions). Consider breaking it into smaller PRs for easier review.`
              });
            }

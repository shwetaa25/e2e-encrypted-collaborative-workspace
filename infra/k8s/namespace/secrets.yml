# k8s/namespace/secrets.yml
# ─────────────────────────────────────────────────────────
# Secret values are injected by the CD pipeline.
# Never commit real values here.
#
# In production use: kubectl create secret generic backend-secrets \
#   --from-literal=database-url="postgresql+asyncpg://..." \
#   --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#   --from-literal=audit-secret="$(openssl rand -hex 32)" \
#   -n encrypted-workspace
#
# Or use Sealed Secrets / External Secrets Operator.
# ─────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: encrypted-workspace
type: Opaque
stringData:
  database-url: "REPLACE_IN_CI"          # postgresql+asyncpg://user:pass@host/db
  jwt-secret: "REPLACE_IN_CI"            # openssl rand -hex 32
  audit-secret: "REPLACE_IN_CI"          # openssl rand -hex 32
  postgres-password: "REPLACE_IN_CI"

---
# ConfigMap: non-sensitive config
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: encrypted-workspace
data:
  ENVIRONMENT: "production"
  NATS_URL: "nats://nats:4222"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"
  OTEL_SERVICE_NAME: "encrypted-workspace-backend"
  CORS_ORIGINS: '["https://your-domain.com"]'

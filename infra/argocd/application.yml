# argocd/application.yml
# ─────────────────────────────────────────────────────────
# Argo CD Application — GitOps deployment.
#
# Argo CD watches the infra/k8s/ folder in this repo.
# When the CD pipeline updates image tags there,
# Argo CD auto-syncs and deploys to the cluster.
#
# Setup:
#   1. Install Argo CD: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#   2. Apply this file: kubectl apply -f argocd/application.yml
#   3. Get the admin password: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
#   4. Open: kubectl port-forward svc/argocd-server -n argocd 8443:443
# ─────────────────────────────────────────────────────────

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: encrypted-workspace
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/e2e-encrypted-workspace.git
    targetRevision: main
    path: infra/k8s    # Watches this folder for changes

  destination:
    server: https://kubernetes.default.svc
    namespace: encrypted-workspace

  syncPolicy:
    automated:
      prune: true      # Remove resources deleted from Git
      selfHeal: true   # Re-apply if someone manually changes the cluster
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health checks — Argo CD waits for these before marking deploy success
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas    # HPA manages replicas — don't diff this
